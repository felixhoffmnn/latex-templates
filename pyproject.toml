[project]
name = "invoice-toolkit"
version = "0.4.0"
description = "A collection of templates for letters and invoices."
authors = [{ name = "Felix Hoffmann", email = "post@felix-hoffmann.dev" }]
readme = "README.md"
license = { file = "COPYING" }
requires-python = ">=3.14"
dependencies = [
    "drafthorse>=2025.2.0",
    "email-validator>=2.2.0",
    "jinja2>=3.1.4",
    "phonenumbers>=8.13.48",
    "pydantic>=2.9.2",
    "pydantic-extra-types>=2.9.0",
    "pypandoc-binary>=1.15",
    "pyyaml>=6.0.2",
    "typst==0.13.2",
]

[project.optional-dependencies]
cli = ["typer>=0.15.0"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "types" },
    { include-group = "test" },
]
test = ["pytest>=8.0"]
lint = ["prek>=0.3.6", "ruff>=0.7.2"]
types = ["ty>=0.0.20", "types-pyyaml>=6.0.12.20240917"]

[project.scripts]
toolkit = "invoice_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "PL",  # Pylint
    "PTH", # flake8-use-pathlib
    "PIE", # flake8-pie
    "PGH", # pygrep
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "RUF", # ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "PLR2004"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ty.environment]
extra-paths = ["tests"]
