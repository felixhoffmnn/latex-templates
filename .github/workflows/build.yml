name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate-typ-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Generate invoice
        run: uv run invoice-toolkit invoice --dry-run
      - name: Generate letter
        run: uv run invoice-toolkit letter --dry-run
      - name: Verify XML files generated
        run: |
          echo "Generated files:"
          ls -l out/invoice/
          xml_count=$(find out/invoice -name '*.xml' | wc -l)
          if [ "$xml_count" -eq 0 ]; then
            echo "ERROR: No XRechnung XML files were generated"
            exit 1
          fi
          echo "Found $xml_count XML file(s)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: invoice-files
          path: |
            out/**/*.pdf
            out/**/*.xml
