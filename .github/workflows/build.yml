name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-validator:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push XRechnung validator
        uses: docker/build-push-action@v6
        with:
          context: container/
          file: container/Containerfile.validator
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/felixhoffmnn/invoice-toolkit/xrechnung-validator:latest

  generate-typ-files:
    needs: build-validator
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Generate invoice (vat-exempt)
        run: >
          uv run --extra cli toolkit invoice
          --invoices examples/vat-exempt/invoices.example.yml
          --config examples/vat-exempt/config.example.yml
          --customer examples/vat-exempt/customer.example.csv
          --dry-run --all
      - name: Generate invoice (vat)
        run: >
          uv run --extra cli toolkit invoice
          --invoices examples/vat/invoices.example.yml
          --config examples/vat/config.example.yml
          --customer examples/vat/customer.example.csv
          --dry-run --all
      - name: Generate letter
        run: >
          uv run --extra cli toolkit letter examples/letter/letter.example.md
          --config examples/letter/config.example.yml
          --dry-run
      - name: Verify generated files
        run: |
          echo "Generated files:"
          ls -la out/invoice/ out/letter/
          xml_count=$(find out/invoice -name '*.xml' | wc -l)
          if [ "$xml_count" -lt 2 ]; then
            echo "ERROR: Expected at least 2 XML files, found $xml_count"
            exit 1
          fi
          echo "Found $xml_count XML file(s)"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate XRechnung XML files
        run: |
          for f in out/invoice/*.xml; do
            echo "Validating: $f"
            docker run --rm -v "$(realpath "$f"):/data/$(basename "$f"):ro" \
              ghcr.io/felixhoffmnn/invoice-toolkit/xrechnung-validator:latest \
              "/data/$(basename "$f")"
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: invoice-files
          path: |
            out/**/*.pdf
            out/**/*.xml
